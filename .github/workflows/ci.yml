name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    name: JVM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM tests and runnable jar
        run: >-
          ./gradlew
          :agent:jvmTest
          :tui:jvmTest
          :app:jvmTest
          :app:jvmJar
          :app:jvmFatJar
          :app:runJvm
          -PappArgs=--help
          --stacktrace

      - name: Run packaged JVM jar
        run: java -jar app/build/libs/koaks-agent.jar --help

      - name: Common source-set guardrails
        shell: bash
        run: |
          if grep -R -n -E '(^|[[:space:]])import[[:space:]]+(java\.|kotlinx\.cinterop\.|platform\.)' \
            agent/src/commonMain tui/src/commonMain app/src/commonMain; then
            echo "Platform-specific imports are not allowed in commonMain"
            exit 1
          fi
          if grep -R -n -E 'CredentialSource|CredentialRef|CredentialResolver|PlatformCredentialResolver|credential_source|credential_name' \
            --include='*.kt' --exclude='*Test.kt' --exclude='TomlConfigParser.kt' agent app tui; then
            echo "Removed credential-store APIs or legacy fields leaked into production code"
            exit 1
          fi

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: windowsX64
            executable: WindowsX64
            experimental: false
            extra_args: ""
          - name: macOS ARM64
            runner: macos-14
            target: macosArm64
            executable: MacosArm64
            experimental: false
            extra_args: ""
          # Koaks Core does not currently publish macOS x64 artifacts. Keep the
          # target visible and exercised as soon as those artifacts become available.
          - name: macOS x64 (Koaks artifact pending)
            runner: macos-13
            target: macosX64
            executable: MacosX64
            experimental: true
            extra_args: "-PkoaksEnableMacosX64=true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis and formatting
        if: matrix.target == 'windowsX64'
        shell: bash
        run: ./gradlew spotlessCheck

      - name: Test and link release executable
        shell: bash
        run: >-
          ./gradlew ${{ matrix.extra_args }}
          :agent:${{ matrix.target }}Test
          :tui:${{ matrix.target }}Test
          :app:${{ matrix.target }}Test
          :app:linkReleaseExecutable${{ matrix.executable }}
          --stacktrace

      - name: Architecture guardrails
        shell: bash
        run: |
          ! grep -R -E "Channel\.UNLIMITED|class AgentApp" \
            --include="*.kt" --include="*.toml" \
            --exclude-dir="*Test" --exclude-dir=build --exclude-dir=.gradle .
          ! grep -R -E "org\.koaks\.agent\.app|CliException|SIDE_EFFECT_TOOLS|ResolvedAppConfig|BuiltinCliTools|NativeCliIo" \
            --include="*.kt" --exclude-dir=build --exclude-dir=.gradle .
          ! grep -R "import org.koaks.agent.definition" \
            --include="*.kt" agent/src/nativeMain/kotlin/org/koaks/agent/tool
          ! grep -R "AgentConfig" \
            --include="*.kt" agent/src/commonMain/kotlin/org/koaks/agent/provider \
            agent/src/nativeMain/kotlin/org/koaks/agent/provider
          ! grep -R "org.koaks.agent.session" \
            --include="*.kt" agent/src/commonMain/kotlin/org/koaks/agent/config \
            agent/src/nativeMain/kotlin/org/koaks/agent/config
          test -z "$(find . -path "*/src/*" -type d -iname "*ios*")"
          git diff --check
